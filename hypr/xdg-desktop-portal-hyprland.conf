# xdg-desktop-portal-hyprland config
# Fixes black screen on screen share (Equibop/Discord) on old GPUs:
# DMA-BUF export/import fails on HD 2000 (crocus) -> Chromium can't consume
# the stream, no link is established, screen stays black.
# force_shm makes the portal deliver plain SHM buffers, which always work.

screencopy {
    output_format = RGBA
    force_shm = true
}
