$hypr = ~/.config/hypr
$hl = ~/.config/hypr/hyprland
$cConf = ~/.config/caelestia

# Variables (colours + other vars)
exec = cp -L --no-preserve=mode --update=none ~/.config/hypr/scheme/default.conf ~/.config/hypr/scheme/current.conf
source = ~/.config/hypr/scheme/current.conf
source = ~/.config/hypr/variables.conf

# Maybe create hyprland configs
exec = ~/.config/hypr/scripts/configs.fish ~/.config/caelestia

# User variables
source = ~/.config/caelestia/hypr-vars.conf

# Default monitor conf
source = ~/.config/hypr/hyprland/monitors.conf

# Configs
source = ~/.config/hypr/hyprland/env.conf
source = ~/.config/hypr/hyprland/general.conf
source = ~/.config/hypr/hyprland/input.conf
source = ~/.config/hypr/hyprland/misc.conf
source = ~/.config/hypr/hyprland/animations.conf
source = ~/.config/hypr/hyprland/decoration.conf
source = ~/.config/hypr/hyprland/group.conf
source = ~/.config/hypr/hyprland/execs.conf
source = ~/.config/hypr/hyprland/rules.conf
source = ~/.config/hypr/hyprland/gestures.conf
source = ~/.config/hypr/hyprland/keybinds.conf
source = ~/.config/hypr/hyprland/scrolling.conf

# User configs
source = ~/.config/caelestia/hypr-user.conf

# exec = hyprctl hyprsunset temperature 4000  # now passed via --temperature on exec-once
exec-once = Telegram
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
