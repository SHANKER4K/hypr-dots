# ### Hyprland ###
# Apps
$terminal = kitty fish
$browser = zen-browser
$editor = code
$fileExplorer = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur (RX 570, caelestia defaults)
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow (RX 570, caelestia defaults)
$shadowEnabled = true
$shadowRange = 15
$shadowRenderPower = 4
$shadowColour = rgba(59599210)

# Gaps
$workspaceGaps = 10
$windowGapsIn = 2
$windowGapsOut = 5
$singleWindowGapsOut = 10

# Window styling
$windowOpacity = 0.95
$windowRounding = 15
$windowRoundingPower = 2

$windowBorderSize = 1
$activeWindowBorderColour = rgba(c2c1ffe6)
$inactiveWindowBorderColour = rgba(c8c5d111)

# Misc
$volumeStep = 10
$cursorTheme = Qogir-Dark
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Alt
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Super, right
$kbPrevWs = Super, left

$kbToggleSpecialWs = Ctrl+Super, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super, Up
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Alt, Space
$kbCloseWindow = Super, C

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Ctrl+Super, R

# Apps
$kbTerminal = Super, Return
$kbBrowser = Super, W
$kbEditor = Super, E
$kbFileExplorer = Super, F

# Misc
$kbSession = Ctrl+Alt, Delete
$kbShowSidebar = Super, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super, K
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
