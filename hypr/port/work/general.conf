general {
    layout = dwindle

    allow_tearing = true  # Allows `immediate` window rule to work

    gaps_workspaces = 10
    gaps_in = 2
    gaps_out = 5
    border_size = 1

    col.active_border = rgba(c2c1ffe6)
    col.inactive_border = rgba(c8c5d111)
}

dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = true
}
