
# Switch input source (before caelestia launcher for priority)
bindl = Super, Space, exec, hyprctl switchxkblayout current next

# ## Shell keybinds
# (Caelestia QML launcher removed — using fuzzel via Super+A instead)

# Misc
bind = Ctrl+Alt, Delete, global, caelestia:session
bind = Super, N, global, caelestia:sidebar
bindl = Ctrl+Alt, C, global, caelestia:clearNotifs
bind = Super, K, global, caelestia:showall
bind = Super, L, global, caelestia:lock

# Restore lock
bindl = Super+Alt, L, exec, caelestia shell -d
bindl = Super+Alt, L, global, caelestia:lock

# Brightness
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media (playerctl)
bindl = Ctrl+Super, Space, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = Ctrl+Super, Equal, exec, playerctl next
bindl = , XF86AudioNext, exec, playerctl next
bindl = Ctrl+Super, Minus, exec, playerctl previous
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# Kill/restart
bindr = Ctrl+Super+Shift, R, exec, qs -c caelestia kill
bindr = Ctrl+Super+Alt, R, exec, qs -c caelestia kill; sleep .1; caelestia shell -d

# Go to workspace #
$wsaction = ~/.config/hypr/scripts/wsaction.fish
bind = Super, 1, exec, ~/.config/hypr/scripts/wsaction.fish workspace 1
bind = Super, 2, exec, ~/.config/hypr/scripts/wsaction.fish workspace 2
bind = Super, 3, exec, ~/.config/hypr/scripts/wsaction.fish workspace 3
bind = Super, 4, exec, ~/.config/hypr/scripts/wsaction.fish workspace 4
bind = Super, 5, exec, ~/.config/hypr/scripts/wsaction.fish workspace 5
bind = Super, 6, exec, ~/.config/hypr/scripts/wsaction.fish workspace 6
bind = Super, 7, exec, ~/.config/hypr/scripts/wsaction.fish workspace 7
bind = Super, 8, exec, ~/.config/hypr/scripts/wsaction.fish workspace 8
bind = Super, 9, exec, ~/.config/hypr/scripts/wsaction.fish workspace 9
bind = Super, 0, exec, ~/.config/hypr/scripts/wsaction.fish workspace 10
# Go to workspace group #
bind = Ctrl+Super, 1, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 1
bind = Ctrl+Super, 2, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 2
bind = Ctrl+Super, 3, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 3
bind = Ctrl+Super, 4, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 4
bind = Ctrl+Super, 5, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 5
bind = Ctrl+Super, 6, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 6
bind = Ctrl+Super, 7, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 7
bind = Ctrl+Super, 8, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 8
bind = Ctrl+Super, 9, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 9
bind = Ctrl+Super, 0, exec, ~/.config/hypr/scripts/wsaction.fish -g workspace 10
# Go to workspace -1/+1
bind = Super, mouse_down, workspace, -1
bind = Super, mouse_up, workspace, +1
binde = Super, left, workspace, -1
binde = Super, right, workspace, +1
binde = Super, Page_Up, workspace, -1
binde = Super, Page_Down, workspace, +1
# Go to workspace group -1/+1
bind = Ctrl+Super, mouse_down, workspace, -10
bind = Ctrl+Super, mouse_up, workspace, +10
# Toggle special workspace
bind = Ctrl+Super, S, exec, caelestia toggle specialws

# Move window to workspace #
bind = Super+Alt, 1, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 1
bind = Super+Alt, 2, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 2
bind = Super+Alt, 3, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 3
bind = Super+Alt, 4, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 4
bind = Super+Alt, 5, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 5
bind = Super+Alt, 6, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 6
bind = Super+Alt, 7, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 7
bind = Super+Alt, 8, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 8
bind = Super+Alt, 9, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 9
bind = Super+Alt, 0, exec, ~/.config/hypr/scripts/wsaction.fish movetoworkspace 10
# Move window to workspace group #
bind = Ctrl+Super+Alt, 1, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 1
bind = Ctrl+Super+Alt, 2, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 2
bind = Ctrl+Super+Alt, 3, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 3
bind = Ctrl+Super+Alt, 4, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 4
bind = Ctrl+Super+Alt, 5, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 5
bind = Ctrl+Super+Alt, 6, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 6
bind = Ctrl+Super+Alt, 7, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 7
bind = Ctrl+Super+Alt, 8, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 8
bind = Ctrl+Super+Alt, 9, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 9
bind = Ctrl+Super+Alt, 0, exec, ~/.config/hypr/scripts/wsaction.fish -g movetoworkspace 10
# Move window to workspace -1/+1
binde = Super+Alt, Page_Up, movetoworkspace, -1
binde = Super+Alt, Page_Down, movetoworkspace, +1
bind = Super+Alt, mouse_down, movetoworkspace, -1
bind = Super+Alt, mouse_up, movetoworkspace, +1
binde = Super+Ctrl, right, movetoworkspace, +1
binde = Super+Ctrl, left, movetoworkspace, -1
# Move window to/from special workspace
bind = Ctrl+Super+Shift, up, movetoworkspace, special:special
bind = Ctrl+Super+Shift, down, movetoworkspace, e+0
bind = Super+Alt, S, movetoworkspace, special:special

# Window groups
binde = Alt, Tab, cyclenext
binde = Shift+Alt, Tab, cyclenext, prev
binde = Ctrl+Alt, Tab, changegroupactive, f
binde = Ctrl+Shift+Alt, Tab, changegroupactive, b
bind = Super, Comma, togglegroup
bind = Super, U, moveoutofgroup
bind = Super+Shift, Comma, lockactivegroup, toggle

# Window actions
bind = Alt, left, movefocus, l
bind = Alt, right, movefocus, r
bind = Super+Alt, up, movefocus, u
bind = Super+Alt, down, movefocus, d
bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d
binde = Super, Minus, resizeactive, -10% 0 # Resize left
binde = Super, Equal, resizeactive, 10% 0 # Resize right
binde = Super+Shift, Minus, resizeactive, 0 -10% # Resize up
binde = Super+Shift, Equal, resizeactive, 0 10%  # Resize down
binde = Super+Alt, left, resizeactive, -10% 0
binde = Super+Alt, right, resizeactive, 10% 0
binde = Super+Alt, up, resizeactive, 0 -10%
binde = Super+Alt, down, resizeactive, 0 10%
bindm = Super, mouse:272, movewindow
bindm = Super, Z, movewindow
bindm = Super, mouse:273, resizewindow
bindm = Super, X, resizewindow
bind = Ctrl+Super, Backslash, centerwindow, 1
bind = Ctrl+Super+Alt, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+Super+Alt, Backslash, centerwindow, 1
bind = Super+Alt, Backslash, exec, caelestia resizer pip  # Move window to picture-in-picture mode
bind = Super, P, pin
bind = Super, Up, fullscreen, 0
bind = Super+Alt, F, fullscreen, 1  # Fullscreen with borders
bind = Super+Alt, Space, togglefloating,
bind = Super, C, killactive,

# Special workspace toggles
bind = Ctrl+Shift, Escape, exec, caelestia toggle sysmon
bind = Super, M, exec, caelestia toggle music
bind = Super, D, exec, caelestia toggle communication
bind = Ctrl+Super, R, exec, caelestia toggle todo

# (waybar retired; bar handled by caelestia shell)

# Apps
bind = Super, Return, exec, app2unit -- kitty fish
bind = Super, W, exec, app2unit -- zen-browser
bind = Super, E, exec, app2unit -- code
bind = Super, G, exec, app2unit -- github-desktop
bind = Super, F, exec, app2unit -- thunar
bind = Super+Alt, E, exec, app2unit -- nemo
bind = Ctrl+Alt, Escape, exec, app2unit -- qps
bind = Ctrl+Alt, V, exec, app2unit -- pavucontrol
bind = Super, T, exec, app2unit -- Telegram
bind = Super, A, exec, fuzzel
bind = Super, R, exec, app2unit -- obsidian

# Utilities
bindl = , Print, exec, hyprshot -m output  # Full screen capture > clipboard
bind = Super+Shift, S, exec, hyprshot -m region  # Capture region
bind = Super, S, exec, hyprshot -m region  # Screenshot (Super+S)
bind = Super+Alt, R, exec, caelestia record -s  # Record screen with sound
bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
bind = Super+Shift+Alt, R, exec, caelestia record -r  # Record region
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker
bind = Super+Shift, W, exec, ~/.config/hypr/scripts/wallpaper-select.fish  # Wallpaper select

# Volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Super+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

# Sleep
bindl = Super+Shift, L, exec, systemctl suspend-then-hibernate

# Clipboard and emoji picker (fuzzel-based — lightweight, no QML)
bind = Super, V, exec, cliphist list | fuzzel --dmenu --prompt="Clipboard > " --with-nth=2 --match-nth=2 --no-sort | cliphist decode | wl-copy
bind = Super+Alt, V, exec, cliphist list | fuzzel --dmenu --prompt="Delete > " --with-nth=2 --match-nth=2 --no-sort | cliphist delete
bind = Super, Period, exec, ~/.config/hypr/scripts/fuzzel-emoji.sh copy
bindl = Ctrl+Shift+Alt, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"  # Alternate paste

# Notification control (caelestia shell)
bind = Super+Shift, N, exec, qs -c caelestia ipc call notifs toggleDnd
bind = Super, N, exec, qs -c caelestia ipc call drawers toggle sidebar

# Health breaks (20-20 / 30-5)
bind = Super+Shift, H, exec, ~/.config/waybar/scripts/health-toggle.sh

# Prayer times
bind = Super+Shift, P, exec, ~/.config/waybar/scripts/prayer.sh menu
bind = Super+Shift+Alt, P, exec, hyprlock -c ~/.config/hypr/prayer-lock.conf

# Caelestia launcher (wallpaper/scheme via '>wallpaper' '>scheme')
bind = Super+Shift, A, global, caelestia:launcher

# Testing
bindl = Super+Alt, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"

# wallpaper-select (caelestia launcher's >wallpaper is the nicer option)
