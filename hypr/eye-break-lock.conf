# 20-20-20 Eye Break Lock Screen
# Minimal lock config that just shows a break reminder

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = 👀 Time to rest your eyes
    color = rgb(ffffff)
    font_size = 40
    font_family = sans-serif
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = Look at something 20 feet (6m) away for 20 seconds
    color = rgb(aaaaaa)
    font_size = 20
    font_family = sans-serif
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Your screens will unlock automatically
    color = rgb(777777)
    font_size = 14
    font_family = sans-serif
    position = 0, -55
    halign = center
    valign = center
}
