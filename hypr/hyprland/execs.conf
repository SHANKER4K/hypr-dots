# Keyring and auth
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pkill xfce4-notifyd 2>/dev/null; mako

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
# exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# Location provider
exec-once = /usr/lib/geoclue-2.0/demos/agent
# Night light: hyprsunset replaces gammastep (Hyprland 0.45+ removed wlr-gamma-control)
# Starts with --temperature 4000 for warm filter at boot.
# Interactive changes: hyprctl hyprsunset temperature <K>  |  hyprctl hyprsunset identity
# Alternative: systemctl --user enable --now hyprsunset.service (then hyprsunset not needed in execs)

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# Resize and move windows based on matches (e.g. pip)
exec-once = caelestia resizer -d

# Waybar (lightweight bar for workspaces, tray, clock — v0.15+ has built-in SNI watcher)
exec-once = waybar
# NOTE: snixembed removed — Waybar 0.15+ handles StatusNotifierItems natively
# Only re-add snixembed if you use XEmbed-only apps that don't support SNI
exec-once = $HOME/.config/hypr/scripts/wallpaper-hook.fish
exec-once = sleep 3 && ~/.config/waybar/auto-hide.fish

# Start shell (caelestia — kept for OSD, launcher, lock screen)
exec-once = caelestia shell -d
exec-once = hyprsunset --temperature 4000

# 20-20-20 Eye break daemon: tracks active use, pauses media, enforces breaks
exec-once = $HOME/.config/hypr/scripts/eye-break.sh

# Prayer times daemon: notifications and screen lock at prayer time
exec-once = $HOME/.config/waybar/scripts/prayer-daemon.sh

