# ### Hyprland ###
# Apps
$terminal = kitty fish
$browser = zen-browser
$editor = code
$fileExplorer = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur (disabled for performance on old GPU)
$blurEnabled = false
$blurSpecialWs = false
$blurPopups = false
$blurInputMethods = false
$blurSize = 4
$blurPasses = 1
$blurXray = false

# Shadow (disabled for performance)
$shadowEnabled = false
$shadowRange = 10
$shadowRenderPower = 1
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 10
$windowGapsIn = 2
$windowGapsOut = 5
$singleWindowGapsOut = 10

# Window styling
$windowOpacity = 1.0
$windowRounding = 0

$windowBorderSize = 1
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = Qogir-Dark
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Alt
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Super, right
$kbPrevWs = Super, left

$kbToggleSpecialWs = Ctrl+Super, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super, Up
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Alt, Space
$kbCloseWindow = Super, C

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Ctrl+Super, R

# Apps
$kbTerminal = Super, Return
$kbBrowser = Super, W
$kbEditor = Super, E
$kbFileExplorer = Super, F

# Misc
$kbSession = Ctrl+Alt, Delete
$kbShowSidebar = Super, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super, K
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
