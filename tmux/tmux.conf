# ┌──────────────────────────────┐
# │     tmux.conf — fish shell   │
# └──────────────────────────────┘

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

# Mouse support
set -g mouse on

# 256 colors + truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides "xterm-kitty:Tc:RGB"
set -ga terminal-overrides "tmux-256color:RGB"

# No delay on Escape key
set -sg escape-time 10

# History
set -g history-limit 10000

# Base index 1
set -g base-index 1
set -g pane-base-index 1

# ── Key bindings ──

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded!"

# Alt+vim hjkl for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrows for pane navigation
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Alt+Shift+hjkl to resize
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# Unbind default Shift+Enter intercept so it passes through to apps (pi, opencode)
unbind -T root S-Enter

# Split panes (easier)
bind | split-window -h
bind - split-window -v

# Vim-style copy mode
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle
set -g mode-keys vi

# ── Status bar ──

set -g status-interval 5
set -g status-position top

# Colors
set -g status-style "bg=#1e1e2e fg=#cdd6f4"

set -g status-left "#[bg=#89b4fa fg=#1e1e2e]  #S #[bg=#1e1e2e fg=#89b4fa]"
set -g status-left-style ""

set -g status-right "#[fg=#a6adc8]#(date +'%H:%M') #[fg=#89b4fa]#[bg=#89b4fa fg=#1e1e2e] #H "
set -g status-right-style ""

set -g window-status-current-style "fg=#1e1e2e bg=#cba6f7"
set -g window-status-current-format " #I #W "
set -g window-status-format " #I:#W "
set -g window-status-separator ""

# Notifications
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ── Plugins / extras ──

# Re-attach user namespace (macOS compat)
if-shell "test -f /usr/libexec/path_helper" "run 'defaults write -g ApplePersistence -bool no'"
